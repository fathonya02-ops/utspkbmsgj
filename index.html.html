<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKBM Sunan Gunung Jati - Sistem Ujian Daring Cloud</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Mammoth.js untuk pembacaan file Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- CUSTOM CONFIRMATION MODAL -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-95 opacity-0 duration-200" id="confirm-modal-content">
            <div class="flex items-center gap-3 mb-4">
                <div id="confirm-icon-wrap" class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 flex-shrink-0">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <div>
                    <h3 id="confirm-title" class="text-lg font-bold text-slate-900">Konfirmasi Tindakan</h3>
                    <p id="confirm-desc" class="text-sm text-slate-500">Apakah Anda yakin ingin melanjutkan proses ini?</p>
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button id="confirm-cancel-btn" onclick="closeConfirmModal(false)" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">Batal</button>
                <button id="confirm-ok-btn" onclick="closeConfirmModal(true)" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 shadow-lg shadow-emerald-600/20 transition">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- TOP HEADER NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('landing')">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold shadow-md shadow-emerald-600/30">
                    <i data-lucide="graduation-cap" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">PKBM Sunan Gunung Jati</h1>
                    <p class="text-xs text-slate-500 font-medium">Sistem Ujian Daring (CBT) Cloud Real-Time</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openTeacherPortal()" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
                    <span>Panel Guru</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="app-root" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Dynamic views rendered via JavaScript -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
            <p>&copy; 2026 <strong>PKBM Sunan Gunung Jati</strong>. Seluruh data tersimpan aman di Cloud Server.</p>
            <p id="cloud-sync-indicator" class="flex items-center gap-1.5 text-slate-400 font-medium">
                <i data-lucide="cloud-off" class="w-3.5 h-3.5"></i> Menghubungkan ke Cloud Server...
            </p>
        </div>
    </footer>

    <!-- APPLICATION LOGIC & FIREBASE CLOUD SYNC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 1. CONFIGURATION & STATE INITIALIZATION
        // =========================================================================
        const TEACHER_PIN = '1234';
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(__firebase_config);

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isCloudReady = false;

        // Default seed data if database is empty
        const defaultData = {
            rooms: [
                {
                    id: 'room-1',
                    code: 'PAKETC-BIND',
                    paket: 'Paket C (Setara SMA)',
                    subject: 'Bahasa Indonesia',
                    duration: 45,
                    status: 'OPEN',
                    showScore: true,
                    createdAt: '2026-11-17',
                    questions: [
                        {
                            id: 'q-101',
                            type: 'PG',
                            text: 'Pendidikan kesetaraan di PKBM Sunan Gunung Jati memberikan kesempatan belajar tanpa batas usia. Ide pokok paragraf tersebut adalah...',
                            options: { A: 'Batasan usia belajar', B: 'Kesempatan belajar melalui pendidikan kesetaraan', C: 'Lokasi PKBM', D: 'Warga putus sekolah' },
                            answer: 'B',
                            weight: 20
                        },
                        {
                            id: 'q-102',
                            type: 'PG',
                            text: 'Penulisan kata baku yang tepat sesuai KBBI adalah...',
                            options: { A: 'Aktifitas & Ijazah', B: 'Aktivitas & Ijasah', C: 'Aktivitas & Ijazah', D: 'Aktipitas & Ijazah' },
                            answer: 'C',
                            weight: 20
                        },
                        {
                            id: 'q-103',
                            type: 'ESSAY',
                            text: 'Jelaskan mengapa program pendidikan kesetaraan sangat penting bagi masyarakat!',
                            options: {},
                            answer: '',
                            weight: 60
                        }
                    ]
                },
                {
                    id: 'room-2',
                    code: 'PAKETB-MTK',
                    paket: 'Paket B (Setara SMP)',
                    subject: 'Matematika Dasar',
                    duration: 60,
                    status: 'OPEN',
                    showScore: true,
                    createdAt: '2026-11-17',
                    questions: [
                        {
                            id: 'q-201',
                            type: 'PG',
                            text: 'Hasil dari -18 + 32 - (-10) adalah...',
                            options: { A: '6', B: '24', C: '-24', D: '40' },
                            answer: 'B',
                            weight: 50
                        },
                        {
                            id: 'q-202',
                            type: 'PG',
                            text: 'Jika 4x - 5 = 19, maka nilai x adalah...',
                            options: { A: '4', B: '5', C: '6', D: '7' },
                            answer: 'C',
                            weight: 50
                        }
                    ]
                }
            ],
            submissions: []
        };

        let appState = {
            rooms: [],
            submissions: []
        };

        let session = {
            view: 'landing', // landing | teacher-login | teacher-dashboard | student-exam | student-result
            teacherTab: 'rooms', // rooms | live | results
            selectedRoomId: 'room-1',
            isTeacherAuth: false,
            activeSubmissionId: null,
            activeQuestionIdx: 0,
            examTimerInterval: null,
            essayDebounceTimer: null
        };

        // Firestore paths using strict required structure
        function getRoomsCol() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'cbt_rooms');
        }
        function getRoomDoc(roomId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'cbt_rooms', roomId);
        }
        function getSubmissionsCol() {
            return collection(db, 'artifacts', appId, 'public', 'data', 'cbt_submissions');
        }
        function getSubmissionDoc(subId) {
            return doc(db, 'artifacts', appId, 'public', 'data', 'cbt_submissions', subId);
        }

        async function saveRoomToCloud(room) {
            if (!currentUser) return;
            try {
                await setDoc(getRoomDoc(room.id), room);
            } catch (err) {
                console.error('Gagal menyimpan ruangan:', err);
                showToast('Gagal menyinkronkan ruangan ke cloud.', 'error');
            }
        }

        async function deleteRoomFromCloud(roomId) {
            if (!currentUser) return;
            try {
                await deleteDoc(getRoomDoc(roomId));
            } catch (err) {
                console.error('Gagal menghapus ruangan:', err);
            }
        }

        async function saveSubmissionToCloud(submission) {
            if (!currentUser) return;
            try {
                await setDoc(getSubmissionDoc(submission.id), submission);
            } catch (err) {
                console.error('Gagal menyimpan progres siswa:', err);
            }
        }

        // Initialize Firebase Authentication & Real-Time Listeners
        async function initCloudSync() {
            const indicator = document.getElementById('cloud-sync-indicator');
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                if (!currentUser) return;

                // Seed default data if rooms collection is empty
                const initialSnap = await getDocs(getRoomsCol());
                if (initialSnap.empty) {
                    for (const r of defaultData.rooms) {
                        await setDoc(getRoomDoc(r.id), r);
                    }
                }

                // Real-time listener for Rooms
                onSnapshot(getRoomsCol(), (snapshot) => {
                    const rooms = [];
                    snapshot.forEach(docSnap => rooms.push(docSnap.data()));
                    rooms.sort((a, b) => (a.id > b.id ? 1 : -1));
                    appState.rooms = rooms;
                    isCloudReady = true;

                    if (indicator) {
                        indicator.innerHTML = `<i data-lucide="cloud-check" class="w-3.5 h-3.5 text-emerald-600"></i> Cloud Sinkron Aktif (Real-Time)`;
                        indicator.className = "flex items-center gap-1.5 text-emerald-600 font-medium";
                    }

                    if (session.view === 'landing') {
                        const activeId = document.activeElement?.id;
                        if (activeId !== 'student-name' && activeId !== 'student-nis' && activeId !== 'student-room-code') {
                            renderApp();
                        }
                    } else if (session.view === 'teacher-dashboard' && session.teacherTab === 'rooms') {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
                            renderApp();
                        }
                    }
                    lucide.createIcons();
                }, (error) => {
                    console.error('Room snapshot error:', error);
                    showToast('Koneksi ruang ujian cloud terganggu.', 'error');
                });

                // Real-time listener for Submissions
                onSnapshot(getSubmissionsCol(), (snapshot) => {
                    const subs = [];
                    snapshot.forEach(docSnap => subs.push(docSnap.data()));
                    subs.sort((a, b) => (b.id > a.id ? 1 : -1));
                    appState.submissions = subs;

                    if (session.view === 'teacher-dashboard') {
                        if (session.teacherTab === 'live') {
                            renderLiveMonitorTabContent();
                        } else if (session.teacherTab === 'results') {
                            const activeId = document.activeElement?.id;
                            if (activeId !== 'manual-essay-score-input') {
                                renderResultsTable();
                            }
                        }
                    }
                }, (error) => {
                    console.error('Submission snapshot error:', error);
                });

            } catch (err) {
                console.error('Cloud auth error:', err);
                if (indicator) {
                    indicator.innerHTML = `<i data-lucide="wifi-off" class="w-3.5 h-3.5 text-rose-600"></i> Cloud Terputus`;
                    indicator.className = "flex items-center gap-1.5 text-rose-600 font-medium";
                }
                showToast('Gagal menghubungkan ke server cloud.', 'error');
            }
        }

        // =========================================================================
        // 2. UI TOAST & CONFIRM MODAL HELPERS
        // =========================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-slate-800 text-white'
            };
            const icons = {
                success: 'check-circle-2',
                error: 'alert-circle',
                warning: 'alert-triangle',
                info: 'info'
            };
            toast.className = `${bgColors[type] || bgColors.info} px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 max-w-sm pointer-events-auto`;
            toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 flex-shrink-0"></i><span class="flex-grow">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        let confirmCallback = null;
        function showConfirmModal(title, desc, onConfirm, isDanger = false) {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            const okBtn = document.getElementById('confirm-ok-btn');
            const iconWrap = document.getElementById('confirm-icon-wrap');

            if (isDanger) {
                okBtn.className = "px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 shadow-lg shadow-rose-600/20 transition";
                iconWrap.className = "w-12 h-12 rounded-full bg-rose-100 flex items-center justify-center text-rose-600 flex-shrink-0";
            } else {
                okBtn.className = "px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 shadow-lg shadow-emerald-600/20 transition";
                iconWrap.className = "w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 flex-shrink-0";
            }

            confirmCallback = onConfirm;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.closeConfirmModal = function(isConfirmed) {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
                if (isConfirmed && confirmCallback) {
                    confirmCallback();
                }
                confirmCallback = null;
            }, 200);
        };

        // =========================================================================
        // 3. NAVIGATION & VIEW CONTROLLER
        // =========================================================================
        function navigateTo(view) {
            if (session.examTimerInterval) {
                clearInterval(session.examTimerInterval);
                session.examTimerInterval = null;
            }
            session.view = view;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderApp() {
            const root = document.getElementById('app-root');
            if (!root) return;

            if (session.view === 'landing') {
                renderLandingView(root);
            } else if (session.view === 'teacher-login') {
                renderTeacherLoginView(root);
            } else if (session.view === 'teacher-dashboard') {
                renderTeacherDashboard(root);
            } else if (session.view === 'student-exam') {
                renderStudentExam(root);
            } else if (session.view === 'student-result') {
                renderStudentResult(root);
            }
            lucide.createIcons();
        }

        // =========================================================================
        // 4. LANDING VIEW (STUDENT ENTRY PORTAL)
        // =========================================================================
        function renderLandingView(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8">
                    <!-- HERO BANNER -->
                    <div class="bg-gradient-to-br from-emerald-700 via-emerald-800 to-teal-900 rounded-3xl p-8 sm:p-12 text-white shadow-2xl relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 w-64 h-64 rounded-full bg-emerald-600/20 blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 max-w-2xl">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/30 text-emerald-200 border border-emerald-400/30 mb-4">
                                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Portal Resmi Ujian Daring PKBM Sunan Gunung Jati
                            </span>
                            <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-4">Selamat Datang, Peserta Didik</h2>
                            <p class="text-emerald-100 text-sm sm:text-base leading-relaxed mb-6">
                                Silakan masukkan Kode Ruangan yang diberikan oleh Guru Pembimbing Anda beserta Nama dan Nomor Induk Siswa (NIS) untuk memulai ujian. Sistem cloud akan menyimpan jawaban Anda secara otomatis.
                            </p>
                            <div class="flex flex-wrap gap-4 text-xs font-medium text-emerald-200">
                                <div class="flex items-center gap-1.5 bg-emerald-900/40 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                                    <i data-lucide="shield-alert" class="w-4 h-4 text-emerald-400"></i> Anti-Bentrok Ruangan
                                </div>
                                <div class="flex items-center gap-1.5 bg-emerald-900/40 px-3 py-1.5 rounded-xl border border-emerald-500/20">

                                </div>
                                <div class="flex items-center gap-1.5 bg-emerald-900/40 px-3 py-1.5 rounded-xl border border-emerald-500/20">
                                    <i data-lucide="smartphone" class="w-4 h-4 text-emerald-400"></i> Responsif HP & Laptop
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- LOGIN CARD & ACTIVE ROOMS -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                        <!-- STUDENT LOGIN FORM -->

                                <div class="flex items-center gap-3 mb-6">
                                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                                        <i data-lucide="log-in" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-bold text-slate-900">Masuk Ruang Ujian</h3>
                                        <p class="text-xs text-slate-500">Isi data diri dan kode ruangan dengan benar</p>
                                    </div>
                                </div>

                                <form onsubmit="handleStudentStartExam(event)" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Kode Ruangan Ujian</label>
                                        <div class="relative">
                                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                                <i data-lucide="key-round" class="w-4 h-4"></i>
                                            </span>
                                            <input type="text" id="student-room-code" required placeholder="Contoh: PAKETC-BIND" oninput="syncRoomCodeInput(this)"
                                                class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold uppercase tracking-wider text-slate-800 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama Lengkap Siswa</label>

                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center font-bold">

                                <div>
                                    <h3 class="text-lg font-bold text-slate-900">Ruangan Tersedia</h3>

        window.handleStudentStartExam = async function(e) {
            e.preventDefault();
            if (!isCloudReady) {
                showToast('Sedang menghubungkan ke Cloud Server, mohon tunggu beberapa detik...', 'warning');
                return;
            }

            const code = document.getElementById('student-room-code').value.trim().toUpperCase();
            const name = document.getElementById('student-name').value.trim();
            const nis = document.getElementById('student-nis').value.trim();

            const room = appState.rooms.find(r => r.code === code);
            if (!room) {
                showToast(`Kode ruangan "${code}" tidak ditemukan! Periksa kembali penulisan kode.`, 'error');
                return;
            }

            if (room.status !== 'OPEN') {
                showToast(`Ruangan "${room.subject}" saat ini sedang DITUTUP oleh guru.`, 'error');
                return;
            }

            if (!room.questions || room.questions.length === 0) {
                showToast('Ruangan ujian ini belum memiliki soal. Hubungi guru penguji.', 'warning');
                return;
            }

            // Cek sesi yang sudah ada di cloud untuk Auto-Recovery (jika siswa ganti HP/browser)
            let existingSub = appState.submissions.find(
                s => s.roomId === room.id && s.studentNis.toLowerCase() === nis.toLowerCase()
            );

            if (existingSub) {
                if (existingSub.status === 'COMPLETED') {
                    session.activeSubmissionId = existingSub.id;
                    showToast('Anda sudah menyelesaikan ujian ini sebelumnya. Menampilkan hasil...', 'info');
                    navigateTo('student-result');
                    return;
                } else {
                    // Pulihkan sesi pengerjaan yang sempat tertutup
                    session.activeSubmissionId = existingSub.id;
                    session.activeQuestionIdx = existingSub.currentQuestionIndex || 0;
                    showToast(`Selamat datang kembali, ${existingSub.studentName}! Jawaban & waktu dipulihkan dari cloud.`, 'success');
                    navigateTo('student-exam');
                    startExamTimer();
                    return;
                }
            }

            // Buat sesi ujian baru di cloud
            const newSubId = `sub-${room.id}-${nis.replace(/[^a-zA-Z0-9]/g, '')}-${Date.now()}`;
            const newSub = {
                id: newSubId,
                roomId: room.id,
                studentName: name,
                studentNis: nis,
                status: 'IN_PROGRESS',
                answers: {},
                currentQuestionIndex: 0,
                remainingSeconds: (room.duration || 60) * 60,
                pgScore: 0,
                essayScore: 0,
                totalScore: 0,
                startedAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            appState.submissions.unshift(newSub);
            session.activeSubmissionId = newSub.id;
            session.activeQuestionIdx = 0;
            await saveSubmissionToCloud(newSub);

            showToast(`Berhasil masuk ke ruang ${room.subject}. Selamat mengerjakan!`, 'success');
            navigateTo('student-exam');
            startExamTimer();
        };

        function startExamTimer() {
            if (session.examTimerInterval) clearInterval(session.examTimerInterval);
            session.examTimerInterval = setInterval(() => {
                const sub = appState.submissions.find(s => s.id === session.activeSubmissionId);
                if (!sub || sub.status === 'COMPLETED' || session.view !== 'student-exam') {
                    clearInterval(session.examTimerInterval);
                    session.examTimerInterval = null;
                    return;
                }

                if (sub.remainingSeconds > 0) {
                    sub.remainingSeconds -= 1;
                    const timerEl = document.getElementById('exam-timer-display');
                    if (timerEl) {
                        timerEl.textContent = formatSeconds(sub.remainingSeconds);
                        if (sub.remainingSeconds <= 60) {
                            timerEl.classList.add('text-rose-400', 'animate-pulse');
                        }
                    }
                    // Sinkronkan sisa waktu ke cloud setiap 10 detik
                    if (sub.remainingSeconds % 10 === 0) {
                        saveSubmissionToCloud(sub);
                    }
                } else {
                    clearInterval(session.examTimerInterval);
                    session.examTimerInterval = null;
                    finalizeStudentExam(true);
                }
            }, 1000);
        }

            if (!sub || !room) return;

            sub.answers[questionId] = optionKey;
            const calc = calculateSubmissionScore(sub, room);
            sub.pgScore = calc.pgScore;
            sub.totalScore = calc.totalScore;
            saveSubmissionToCloud(sub);
            renderStudentExam(document.getElementById('app-root'));
            lucide.createIcons();
        };

        window.saveEssayAnswer = function(questionId, text) {
            const sub = appState.submissions.find(s => s.id === session.activeSubmissionId);
            if (!sub) return;
            sub.answers[questionId] = text;

            if (session.essayDebounceTimer) clearTimeout(session.essayDebounceTimer);
            session.essayDebounceTimer = setTimeout(() => {
                saveSubmissionToCloud(sub);
            }, 600);
        };

        window.changeExamQuestion = function(newIdx) {
            const sub = appState.submissions.find(s => s.id === session.activeSubmissionId);
            const room = appState.rooms.find(r => r.id === sub?.roomId);
            if (!sub || !room) return;
            if (newIdx < 0 || newIdx >= room.questions.length) return;

            session.activeQuestionIdx = newIdx;
            sub.currentQuestionIndex = newIdx;
            saveSubmissionToCloud(sub);
            renderStudentExam(document.getElementById('app-root'));

        };

                () => finalizeStudentExam(false),
                true
            );
        };

        function calculateSubmissionScore(sub, room) {
            let pgCorrect = 0;
            let pgTotalWeight = 0;
            let pgObtainedWeight = 0;

            room.questions.forEach(q => {
                if (q.type === 'PG') {
                    pgTotalWeight += (q.weight || 10);
                    if (sub.answers[q.id] === q.answer) {
                        pgObtainedWeight += (q.weight || 10);
                    }
                }
            });

            const pgScore = pgTotalWeight > 0 ? Math.round((pgObtainedWeight / pgTotalWeight) * 100) : 100;
            const essayScore = sub.essayScore || 0;
            const hasEssay = room.questions.some(q => q.type === 'ESSAY');
            const totalScore = hasEssay ? Math.round((pgScore * 0.6) + (essayScore * 0.4)) : pgScore;

            return { pgScore, totalScore };
        }

        function finalizeStudentExam(isTimeout = false) {
            const sub = appState.submissions.find(s => s.id === session.activeSubmissionId);
            const room = appState.rooms.find(r => r.id === sub?.roomId);
            if (!sub || !room) return;

            const now = new Date();
            sub.status = 'COMPLETED';
            sub.submittedAt = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const calc = calculateSubmissionScore(sub, room);
            sub.pgScore = calc.pgScore;
            sub.totalScore = calc.totalScore;
            saveSubmissionToCloud(sub);

            if (isTimeout) {
                showToast('Waktu habis! Jawaban otomatis dikumpulkan.', 'warning');
            } else {
                showToast('Jawaban ujian berhasil dikumpulkan ke cloud!', 'success');
            }
            navigateTo('student-result');
        }

        window.selectTeacherRoom = function(roomId) {

        window.handleCreateRoom = function(e) {
            e.preventDefault();
            const paket = document.getElementById('new-room-paket').value;
            const subject = document.getElementById('new-room-subject').value.trim();
            const code = document.getElementById('new-room-code').value.trim().toUpperCase().replace(/\s+/g, '-');
            const duration = parseInt(document.getElementById('new-room-duration').value) || 60;

            if (appState.rooms.some(r => r.code === code)) {
                showToast(`Kode ruangan "${code}" sudah digunakan! Gunakan kode unik lain.`, 'error');
                return;
            }

            const newRoom = {
                id: 'room-' + Date.now(),
                code,
                paket,
                subject,
                duration,
                status: 'OPEN',
                showScore: true,
                createdAt: new Date().toLocaleDateString('id-ID'),
                questions: []
            };

            appState.rooms.push(newRoom);
            session.selectedRoomId = newRoom.id;
            saveRoomToCloud(newRoom);
            showToast(`Ruangan "${subject}" (${code}) berhasil dibuat di cloud!`, 'success');
            renderTeacherDashboard(document.getElementById('app-root'));
            lucide.createIcons();
        };

        window.toggleRoomStatus = function(roomId) {
            const room = appState.rooms.find(r => r.id === roomId);
            if (!room) return;
            room.status = room.status === 'OPEN' ? 'CLOSED' : 'OPEN';
            saveRoomToCloud(room);
            showToast(`Ruangan ${room.subject} sekarang ${room.status === 'OPEN' ? 'DIBUKA' : 'DITUTUP'}.`, 'info');
            renderTeacherDashboard(document.getElementById('app-root'));
            lucide.createIcons();
        };

        window.deleteRoom = function(roomId) {
            const room = appState.rooms.find(r => r.id === roomId);
            if (!room) return;
            showConfirmModal(
                'Hapus Ruangan Ujian?',
                `Yakin ingin menghapus ruangan "${room.subject}" (${room.code}) beserta seluruh soal dan data nilainya?`,
                async () => {
                    appState.rooms = appState.rooms.filter(r => r.id !== roomId);
                    const relatedSubs = appState.submissions.filter(s => s.roomId === roomId);
                    appState.submissions = appState.submissions.filter(s => s.roomId !== roomId);

                    await deleteRoomFromCloud(roomId);
                    for (const sub of relatedSubs) {
                        await deleteDoc(getSubmissionDoc(sub.id));
                    }

                    showToast('Ruangan berhasil dihapus dari cloud.', 'info');
                    renderTeacherDashboard(document.getElementById('app-root'));
                    lucide.createIcons();

            );

        window.handleAddManualQuestion = function(e, roomId) {
            e.preventDefault();
            const room = appState.rooms.find(r => r.id === roomId);
            if (!room) return;

            const type = document.getElementById('mq-type').value;
            const weight = parseInt(document.getElementById('mq-weight').value) || 20;
            const text = document.getElementById('mq-text').value.trim();

            const newQ = {
                id: 'q-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                type,
                text,
                options: type === 'PG' ? {
                    A: document.getElementById('mq-opt-a').value.trim(),
                    B: document.getElementById('mq-opt-b').value.trim(),
                    C: document.getElementById('mq-opt-c').value.trim(),
                    D: document.getElementById('mq-opt-d').value.trim()
                } : {},
                answer: type === 'PG' ? document.getElementById('mq-answer').value : '',
                weight
            };

            room.questions.push(newQ);
            saveRoomToCloud(room);
            showToast('Soal berhasil ditambahkan ke cloud!', 'success');
            renderTeacherDashboard(document.getElementById('app-root'));
            lucide.createIcons();
        };

        window.deleteQuestion = function(roomId, questionId) {
            const room = appState.rooms.find(r => r.id === roomId);
            if (!room) return;
            room.questions = room.questions.filter(q => q.id !== questionId);
            saveRoomToCloud(room);
            showToast('Soal dihapus.', 'info');
            renderTeacherDashboard(document.getElementById('app-root'));
            lucide.createIcons();
        };

        // WORD UPLOAD HANDLER WITH MAMMOTH.JS
        window.handleWordUpload = function(e, roomId) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                const arrayBuffer = event.target.result;
                try {
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    const text = result.value;
                    const parsedQuestions = parseWordTextToQuestions(text);

                    if (parsedQuestions.length === 0) {
                        showToast('Tidak ada soal yang terdeteksi. Periksa kembali format file Word Anda.', 'warning');
                        return;
                    }

                    const room = appState.rooms.find(r => r.id === roomId);
                    if (room) {
                        room.questions.push(...parsedQuestions);
                        saveRoomToCloud(room);
                        showToast(`Berhasil mengimpor ${parsedQuestions.length} soal dari file Word "${file.name}"!`, 'success');
                        renderTeacherDashboard(document.getElementById('app-root'));
                        lucide.createIcons();
                    }
                } catch (err) {
                    console.error('Word parse error:', err);
                    showToast('Gagal membaca file Word (.docx).', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function parseWordTextToQuestions(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const questions = [];
            let currentQ = null;

            lines.forEach(line => {
                if (/^(Soal\s*\d+|\d+\.)/i.test(line)) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = {
                        id: 'q-word-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                        type: 'PG',
                        text: line.replace(/^(Soal\s*\d+|\d+\.)\s*/i, ''),
                        options: { A: '', B: '', C: '', D: '' },
                        answer: 'A',
                        weight: 20
                    };
                } else if (/^[A-D][\.\)]\s*/i.test(line)) {
                    if (currentQ) {
                        const optKey = line.charAt(0).toUpperCase();
                        const optVal = line.replace(/^[A-D][\.\)]\s*/i, '');
                        if (currentQ.options) currentQ.options[optKey] = optVal;
                    }
                } else if (/^Kunci[:\s]*/i.test(line)) {
                    if (currentQ) {
                        const ans = line.replace(/^Kunci[:\s]*/i, '').trim().toUpperCase();
                        if (['A', 'B', 'C', 'D'].includes(ans)) currentQ.answer = ans;
                    }
                } else {
                    if (currentQ) {
                        currentQ.text += ' ' + line;
                    }
                }
            });
            if (currentQ) questions.push(currentQ);
            return questions;
        }

        // INSPECT / MANUAL ESSAY GRADING MODAL
        window.inspectStudentAnswers = function(subId) {

                document.body.appendChild(modal);

            modal.innerHTML = `

                    <div class="p-6 border-b border-slate-100 flex items-center justify-between">

        window.saveManualEssayScore = function(subId) {
            const sub = appState.submissions.find(s => s.id === subId);
            const room = appState.rooms.find(r => r.id === sub?.roomId);
            if (!sub || !room) return;

            const val = parseInt(document.getElementById('manual-essay-score-input').value) || 0;
            sub.essayScore = Math.max(0, Math.min(100, val));
            const calc = calculateSubmissionScore(sub, room);
            sub.totalScore = calc.totalScore;
            saveSubmissionToCloud(sub);

            showToast(`Nilai esai disimpan! Total nilai akhir menjadi ${sub.totalScore}.`, 'success');
            renderResultsTable();
            inspectStudentAnswers(subId);
        };

        window.exportResultsToCSV = function() {
            const completedSubs = appState.submissions.filter(s => s.status === 'COMPLETED');
            if (completedSubs.length === 0) {
                showToast('Belum ada data nilai untuk diekspor.', 'warning');
                return;
            }

            let csv = 'NIS,Nama Siswa,Ruangan,Nilai PG,Nilai Esai,Nilai Total,Waktu Kumpul\n';
            completedSubs.forEach(sub => {
                const room = appState.rooms.find(r => r.id === sub.roomId);
                csv += `"${sub.studentNis}","${sub.studentName}","${room ? room.subject : 'N/A'}",${sub.pgScore},${sub.essayScore || 0},${sub.totalScore},"${sub.submittedAt || '-'}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Rekap_Nilai_Ujian_PKBM_SunanGunungJati_${new Date().toISOString().slice(0, 10)}.csv`;

            showToast('Rekap nilai berhasil diekspor ke file CSV (Excel).', 'success');
